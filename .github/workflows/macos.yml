# JTDX-VU macOS builds: Apple Silicon (macos-14 runner, so it runs on
# macOS 14+) and Intel (macos-15-intel). Each is a self-contained,
# ad-hoc signed JTDX-VU.app from macos-bundle.sh, zipped with ditto.
# Runs on demand or on a v* tag; on a tag the zips go to that release.
name: macos

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14
            arch: arm64
          - runner: macos-15-intel
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    # Homebrew no longer has Intel bottles for the newest versions of
    # Qt's dependencies, so the Intel job compiles them (openssl, qt@5 ...)
    # from source: allow GitHub's full 6 hours
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      # The Intel runner is a Homebrew Tier 3 host: no bottles, so gcc, Qt 5,
      # Boost and their dependencies compile from source (~3.5 h).  Keep the
      # kegs that step had to install in one tarball and put them back next
      # time.  Bump the -vN suffix to force a rebuild (new runner image, new
      # formula versions wanted).
      - name: Restore Homebrew kegs
        if: matrix.arch == 'x86_64'
        id: brewcache
        uses: actions/cache/restore@v4
        with:
          path: ~/brew-cache
          key: brew-kegs-${{ matrix.runner }}-v1

      - name: Dependencies
        id: deps
        run: |
          P=$(brew --prefix)
          C=~/brew-cache
          FORMULAE="qt@5 hamlib fftw gcc boost libusb webp"
          brew list --formula -1 | sort > /tmp/kegs-before.txt
          if [ -f $C/kegs.tar ]; then
            echo "restoring $(wc -l < $C/kegs.list) cached kegs"
            tar -xf $C/kegs.tar -C "$P"
            # keg-only formulae (qt@5) refuse to link; their opt/ symlink came from the tarball
            for f in $(cat $C/kegs.list); do brew link --overwrite "$f" >/dev/null 2>&1 || true; done
            export HOMEBREW_NO_AUTO_UPDATE=1 HOMEBREW_NO_INSTALL_UPGRADE=1
          else
            brew update --quiet || true
          fi
          # The runner image has a bin/openssl that openssl@3 cannot link over
          # (brew unlink openssl@1.1 removes nothing), so brew install exits 1
          # with everything built: accept that when every formula is there
          brew install $FORMULAE || brew list --versions $FORMULAE
          brew link --overwrite openssl@3 >/dev/null 2>&1 || true
          if [ "${{ matrix.arch }}" = "x86_64" ] && [ ! -f $C/kegs.tar ]; then
            # never fail the build over the cache
            (
              set -e
              mkdir -p $C
              brew list --formula -1 | sort > /tmp/kegs-after.txt
              comm -13 /tmp/kegs-before.txt /tmp/kegs-after.txt > $C/kegs.list
              echo "caching $(wc -l < $C/kegs.list) kegs:"; cat $C/kegs.list
              cd "$P"
              tar -cf $C/kegs.tar $(sed 's|^|Cellar/|' $C/kegs.list) $(sed 's|^|opt/|' $C/kegs.list)
              ls -lh $C/kegs.tar
              echo "created=true" >> "$GITHUB_OUTPUT"
            ) || { echo "::warning::could not create the Homebrew keg cache"; rm -rf $C; }
          fi

      # saved here, not in a post step, so a failure later in the job cannot
      # throw away three hours of compiling
      - name: Save Homebrew kegs
        if: matrix.arch == 'x86_64' && steps.deps.outputs.created == 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/brew-cache
          key: brew-kegs-${{ matrix.runner }}-v1

      - name: Configure
        run: |
          B=$(brew --prefix)
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_POLICY_VERSION_MINIMUM=3.5 \
            -DCMAKE_PREFIX_PATH="$B/opt/qt@5;$B" \
            -DCMAKE_Fortran_COMPILER="$B/bin/gfortran" \
            -DWSJT_GENERATE_DOCS=OFF -DWSJT_SKIP_MANPAGES=ON \
            -DCMAKE_INSTALL_PREFIX="$PWD/build/dist"

      - name: Build
        run: cmake --build build -j 4

      - name: Bundle
        run: |
          ./macos-bundle.sh
          VER=$(sed -n 's/^set (JTDXVU_VERSION \(.*\))/\1/p' Versions.cmake)
          echo "VER=$VER" >> $GITHUB_ENV
          # self-check: the app must load no Homebrew library
          test "$(file build/bundle/JTDX-VU.app/Contents/MacOS/jtdx | grep -c '${{ matrix.arch }}')" = 1
          Z="JTDX-VU-$VER-macos-${{ matrix.arch }}.zip"
          ditto -c -k --norsrc --keepParent build/bundle/JTDX-VU.app "$Z"
          shasum -a 256 "$Z" > "$Z.sha256"
          echo "Z=$Z" >> $GITHUB_ENV

      - uses: actions/upload-artifact@v4
        with:
          name: JTDX-VU-macos-${{ matrix.arch }}
          path: JTDX-VU-*-macos-*.zip*

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --title "JTDX-VU $GITHUB_REF_NAME" --notes "macOS builds attached by CI."
          gh release upload "$GITHUB_REF_NAME" "$Z" "$Z.sha256" --clobber
