# JTDX-VU Windows x64 build (MSYS2 / MinGW-w64, Qt 5).
# Runs on demand or on a v* tag; on a tag the zip is attached to that
# tag's GitHub release (created if missing).
name: windows

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4

      # JTDX generates its OmniRig COM interface from the registered type
      # library at configure time (dumpcpp), so OmniRig must be installed
      - name: OmniRig
        shell: pwsh
        run: |
          Invoke-WebRequest https://www.dxatlas.com/OmniRig/Files/OmniRig.zip -OutFile OmniRig.zip
          Expand-Archive OmniRig.zip -DestinationPath omnirig
          $setup = Get-ChildItem omnirig -Recurse -Filter *.exe | Select-Object -First 1
          Start-Process -Wait -FilePath $setup.FullName -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART'
          Get-ChildItem 'HKLM:\SOFTWARE\Classes\TypeLib\{4FE359C5-A58F-459D-BE95-CA559FB4F270}' -Recurse | Select-Object -First 3

      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            zip
            make
            mingw-w64-x86_64-pkgconf
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-gcc-fortran
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-qt5-base
            mingw-w64-x86_64-qt5-multimedia
            mingw-w64-x86_64-qt5-serialport
            mingw-w64-x86_64-qt5-websockets
            mingw-w64-x86_64-qt5-tools
            mingw-w64-x86_64-qt5-svg
            mingw-w64-x86_64-qt5-activeqt
            mingw-w64-x86_64-qt5-translations
            mingw-w64-x86_64-fftw
            mingw-w64-x86_64-boost
            mingw-w64-x86_64-libusb

      # MSYS2 does not package Hamlib; build the same release the macOS
      # build uses (Homebrew hamlib 4.7.2) into the MinGW prefix
      - name: Hamlib
        run: |
          curl -sSfL -o hamlib.tar.gz https://github.com/Hamlib/Hamlib/releases/download/4.7.2/hamlib-4.7.2.tar.gz
          echo "ae1fcf2dbc80ea0786ea8f047b09399c3f7737d1930442f61a031708ed33e88f  hamlib.tar.gz" | sha256sum -c -
          tar xzf hamlib.tar.gz
          cd hamlib-4.7.2
          ./configure --prefix=/mingw64 --disable-static --enable-shared --without-readline \
            --without-indi --without-cxx-binding --disable-winradio
          make -j 4
          make install

      - name: Configure
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_POLICY_VERSION_MINIMUM=3.5 \
            -DWSJT_GENERATE_DOCS=OFF -DWSJT_SKIP_MANPAGES=ON \
            -DCMAKE_INSTALL_PREFIX="$PWD/stage"

      - name: Build
        run: cmake --build build -j 4

      - name: Stage
        run: |
          # CMake's own fixup_bundle step may fail on MSYS2; the files it
          # installs before that are what we need
          cmake --install build || true
          test -f stage/bin/jtdx.exe
          VER=$(sed -n 's/^set (JTDXVU_VERSION \(.*\))/\1/p' Versions.cmake)
          echo "VER=$VER" >> $GITHUB_ENV
          windeployqt --release --no-compiler-runtime --dir stage/bin stage/bin/jtdx.exe
          # every MinGW DLL the executables and Qt plugins pull in
          for pass in 1 2 3; do
            find stage -name '*.exe' -o -name '*.dll' | while read -r f; do
              ldd "$f" | awk '/\/mingw64\/bin\//{print $3}'
            done | sort -u | while read -r dll; do cp -n "$dll" stage/bin/; done
          done
          cp COPYING stage/
          cp README.md stage/JTDX-VU-README.md

      - name: Package
        run: |
          mv stage "JTDX-VU-$VER-windows-x64"
          zip -qr "JTDX-VU-$VER-windows-x64.zip" "JTDX-VU-$VER-windows-x64"
          sha256sum "JTDX-VU-$VER-windows-x64.zip" > "JTDX-VU-$VER-windows-x64.zip.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: JTDX-VU-windows-x64
          path: JTDX-VU-*-windows-x64.zip*

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --title "JTDX-VU $GITHUB_REF_NAME" --notes "Windows build attached by CI."
          gh release upload "$GITHUB_REF_NAME" JTDX-VU-*-windows-x64.zip JTDX-VU-*-windows-x64.zip.sha256 --clobber
